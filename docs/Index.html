<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="files/css/global/Global_style.css">
    <link rel="stylesheet" href="files/css/pages/Index_style.css">
    <title>Samuel Ovalle</title>

    <!-- Fuente Audiowide usada bajo SIL Open Font License v1.1 -->

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@v0.178.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.178.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <video id="initial_animation" autoplay muted playsinline>
        <source src="assets/vid/animacion_inicial_portafoleo.mp4" type="">
    </video>
    <header>
        <nav>
            <ul>
                <li><a href="#presentation">Home</a></li>
                <li><a href="#technologies">Technologies</a></li>
                <li><a href="#projects">Projects</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="presentation">
            <canvas class="back_ground_game" id="back_game"></canvas>
            <img src="assets/img/ships/ship-1.svg" class="ship" id="ship_1" alt="Ship one">
            <img src="assets/img/ships/ship-2.svg" class="ship" id="ship_2" alt="Ship two">
            <img src="assets/img/ships/ship-3.svg" class="ship" id="ship_3" alt="Ship three">
            <img src="assets/img/ships/ship-4.svg" class="ship" id="ship_4" alt="Ship four">

            <div class="content_my_name">
                <h1 id="my_name"></h1>
                <span class="cursor"></span>
            </div>
        </section>

        <div class="blurring_effect_separation"></div>

        <section id="navigation_tree">
            <div id="technologies" class="scene"></div>
            <div class="blurring_effect_separation"></div>
            <div id="projects" class="scene"></div>
        </section>
    </main>
    <script type="module" src="files/js/pages/index/index_3d_model.js"></script>
    <script type="module" src="files/js/pages/index/index_game_script.js"></script>
    <script type="module" src="files/js/pages/index/Index_script.js"></script>

</body>
</html>
