<body>
    <video id="initial_animation" autoplay muted playsinline>

                <img src="assets/img/ships/ship-1.svg" class="ship" id="ship_1" alt="Ship one">

                <h1 id="my_name"></h1>
                <span class="cursor"></span>
            </div>
        </section>
        <section id="navigation_tree">
            <div class="row L">
                <svg class="row_svg" id="row_l" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82.6 56.86">

            </div>
            <div class="row R">
                <svg class="row_svg" id="row_r" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82.6 56.86">

                </svg>
            </div>
            <div class="card"></div>

        </section>
    </main>
